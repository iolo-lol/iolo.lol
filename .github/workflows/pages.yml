# TEMPORARY FALLBACK during cutover to Cloudflare Workers Static Assets
# (iolo.lol#20, ADR-0005). Remove this workflow and the Pages deployment once
# QA verifies the Cloudflare production surface and iolo.lol DNS serves the
# canonical domain from Cloudflare.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate static site from canonical signal state
        run: pnpm --filter @iolo.lol/web generate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/site
      - uses: actions/deploy-pages@v4
